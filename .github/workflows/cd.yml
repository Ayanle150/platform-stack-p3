name: Deploy to AKS

on:
  workflow_run:
    workflows:
      - Build and Push
    types:
      - completed
    branches:
      - main

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    name: Deploy with Helm
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Get AKS credentials
        run: |
          az aks get-credentials \
            --resource-group ${{ secrets.RESOURCE_GROUP }} \
            --name ${{ secrets.AKS_CLUSTER_NAME }}

      - name: Install Helm
        uses: azure/setup-helm@v4

      - name: Set image tag
        id: tag
        run: echo "TAG=${{ github.event.workflow_run.head_sha }}" >> $GITHUB_OUTPUT

      - name: Deploy api
        run: |
          helm upgrade --install api ./helm/api \
            --set image.repository=${{ secrets.ACR_NAME }}.azurecr.io/api \
            --set image.tag=${{ steps.tag.outputs.TAG }} \
            --wait

      - name: Deploy frontend
        run: |
          helm upgrade --install frontend ./helm/frontend \
            --set image.repository=${{ secrets.ACR_NAME }}.azurecr.io/frontend \
            --set image.tag=${{ steps.tag.outputs.TAG }} \
            --set env.API_URL=http://api:8000 \
            --wait
